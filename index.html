<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부기공 맛집 지도</title>
  <link rel="stylesheet" href="public/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="app">
    <header class="header">
      <div>
        <h1>부기공 맛집 지도 <span class="wave">🌊</span></h1>
        <p class="header-sub">해운대 · 부산기계공업고등학교 학생들끼리 공유해요</p>
      </div>
      <span id="user-badge" class="user-badge"></span>
    </header>

    <div class="toolbar">
      <div class="view-toggle">
        <button id="btn-list" class="toggle-btn active">📋 목록</button>
        <button id="btn-map" class="toggle-btn">🗺️ 지도</button>
      </div>
      <input id="search" type="text" placeholder="가게 이름 검색" />
      <div class="sort-row">
        <div id="categories" class="chips"></div>
        <select id="sort">
          <option value="likes">🔥 인기순</option>
          <option value="rating">⭐ 평점순</option>
          <option value="reviews">💬 후기 많은순</option>
          <option value="new">🆕 최신순</option>
        </select>
      </div>
    </div>

    <main id="list" class="list"></main>
    <div id="empty" class="empty hidden">아직 맛집이 없어요. 첫 번째로 공유해보세요!</div>

    <div id="map-view" class="map-view hidden">
      <div id="map"></div>
      <p class="map-hint">마커를 누르면 가게 정보를 볼 수 있어요</p>
    </div>

    <button id="fab" class="fab">+</button>
  </div>

  <div id="modal-add" class="modal hidden">
    <div class="modal-card">
      <h2>맛집 공유하기</h2>
      <label>가게 이름 *</label>
      <input id="f-name" type="text" placeholder="예: 해운대 기장국밥" maxlength="50" />
      <label>종류</label>
      <select id="f-category">
        <option>한식</option><option>중식</option><option>일식</option>
        <option>양식</option><option>분식</option><option>카페</option>
        <option>야식</option><option>기타</option>
      </select>
      <label>위치</label>
      <input id="f-location" type="text" placeholder="예: 좌동, 도보 10분" maxlength="120" />
      <label>지도에 위치 찍기 (선택)</label>
      <div id="pick-map" class="pick-map"></div>
      <p id="pick-pos" class="pick-pos">지도를 클릭해 가게 위치를 표시해주세요</p>
      <label>가격대</label>
      <input id="f-price" type="text" placeholder="예: 5,000~8,000원" maxlength="50" />
      <label>한줄 소개</label>
      <input id="f-memo" type="text" placeholder="예: 국밥 양 진짜 많음" maxlength="300" />
      <label>별점</label>
      <div id="f-stars" class="stars-input"></div>
      <label>첫 후기</label>
      <textarea id="f-review" rows="2" placeholder="왜 맛있었는지 알려주세요" maxlength="300"></textarea>
      <div class="modal-actions">
        <button id="add-cancel" class="btn-ghost">취소</button>
        <button id="add-save" class="btn-primary">공유하기</button>
      </div>
    </div>
  </div>

  <div id="modal-detail" class="modal hidden">
    <div class="modal-card" id="detail-body"></div>
  </div>

  <script src="public/app.js"></script>
</body>
</html>
